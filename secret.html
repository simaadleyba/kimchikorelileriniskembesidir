<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>—</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .secret-container { text-align: center; max-width: 400px; padding: 24px; }
    #cat-img { max-width: 320px; display: block; margin: 0 auto 24px; transition: opacity 0.6s; }
    #qwerty-section { display: none; text-align: left; }
    #okay-btn { margin-top: 16px; }
    #final-msg { display: none; margin-top: 24px; font-family: 'Courier New', monospace; font-size: 0.85rem; color: var(--muted); }
    #link-btns { display: none; margin-top: 24px; flex-direction: column; gap: 12px; }
    #link-btns a {
      opacity: 0;
      transition: opacity 0.3s ease, background 0.2s ease, color 0.2s ease;
    }
    #link-btns a.visible { opacity: 1; }
    #link-btns a {
      background: transparent;
      border: 1px solid var(--text);
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      padding: 10px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      text-decoration: none;
      display: inline-block;
    }
    #link-btns a:hover {
      background: var(--text);
      color: var(--bg);
    }
  </style>
</head>
<body>
  <div class="secret-container">
    <img src="https://cataas.com/cat" alt="" id="cat-img">

    <button id="okay-btn">okay</button>

    <div id="qwerty-section">
      <div class="question" style="margin-bottom: 16px;">what is your opinion on the QWERTY keyboard layout?</div>
      <textarea id="qwerty-input" rows="4" placeholder=""></textarea>
      <div style="margin-top: 16px;">
        <button id="qwerty-submit">submit</button>
      </div>
    </div>

    <div id="final-msg">okay. that was weird though. now:</div>

    <div id="link-btns">
      <a href="https://www.google.com/search?q=country+roads+take+me+home" class="staggered">country roads</a>
      <a href="#" id="take-me-home" class="staggered">take me home</a>
      <a href="https://en.wikipedia.org/wiki/Place" class="staggered">to the place</a>
      <a href="http://www.chinesethought.cn/EN/shuyu_show.aspx?shuyu_id=2060" class="staggered">i belong</a>
      <a href="https://www.google.com/maps/place/West+Virginia" class="staggered">west virginia</a>
    </div>
  </div>

  <script>
    // shared utils — inlined per page
    function getGateKey() { return localStorage.getItem('gate'); }
    function requireGate() { if (!getGateKey()) { window.location.href = 'index.html'; return false; } return true; }
    function save(k, v) { localStorage.setItem(k, typeof v === 'object' ? JSON.stringify(v) : String(v)); }
    function load(k) { const v = localStorage.getItem(k); try { return JSON.parse(v); } catch { return v; } }
    function navigate(url) { setTimeout(() => { window.location.href = url; }, 150); }

    if (!requireGate()) { /* redirecting */ }

    save('secret_found', true);

    document.getElementById('okay-btn').addEventListener('click', () => {
      const img = document.getElementById('cat-img');
      img.style.opacity = '0';
      setTimeout(() => {
        img.style.display = 'none';
        document.getElementById('okay-btn').style.display = 'none';
        document.getElementById('qwerty-section').style.display = 'block';
      }, 800);
    });

    document.getElementById('qwerty-submit').addEventListener('click', () => {
      const val = document.getElementById('qwerty-input').value.trim();
      if (!val) return;

      save('qwerty_opinion', val);
      document.getElementById('qwerty-section').style.display = 'none';

      const finalMsg = document.getElementById('final-msg');
      finalMsg.style.display = 'block';

      const returnUrl = localStorage.getItem('secret_return') || 'p1.html';
      document.getElementById('take-me-home').addEventListener('click', (e) => {
        e.preventDefault();
        navigate(returnUrl);
      });

      setTimeout(() => {
        const linkBtns = document.getElementById('link-btns');
        linkBtns.style.display = 'flex';

        const links = linkBtns.querySelectorAll('.staggered');
        links.forEach((link, i) => {
          setTimeout(() => link.classList.add('visible'), i * 200);
        });
      }, 1000);
    });
  </script>
</body>
</html>
