<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p13</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="progress-bar-container"><div id="progress-bar"></div></div>
  <div id="timer">00:00</div>

  <div class="container">
    <div class="final-text" style="margin-bottom: 48px;">
      <h2>now we wait.</h2>
      <p class="flavor">i'll reach out if the vibe is right.</p>
    </div>

    <div class="question" style="margin-bottom: 24px;">leave something, if you want.</div>

    <div class="btn-group" style="margin-bottom: 24px;" id="contact-type-btns">
      <button class="contact-type-btn" data-type="instagram">instagram / twitter</button>
      <button class="contact-type-btn" data-type="reddit">reddit</button>
      <button class="contact-type-btn" data-type="email">email</button>
    </div>

    <div class="contact-input" id="input-instagram">
      <input type="text" id="val-instagram" placeholder="@username" autocomplete="off">
    </div>
    <div class="contact-input" id="input-reddit">
      <input type="text" id="val-reddit" placeholder="u/username" autocomplete="off">
    </div>
    <div class="contact-input" id="input-email">
      <input type="email" id="val-email" placeholder="address" autocomplete="off">
    </div>

    <div style="margin-top: 24px;">
      <button id="submit-btn">done.</button>
    </div>

  </div>

  <div class="msg" id="msg" style="display:none; padding: 0 24px;"></div>

  <iframe name="hidden_iframe" style="display:none;"></iframe>
  <form id="gform" action="https://docs.google.com/forms/d/e/1FAIpQLSeG2PqeBMrnhRhZR8WvWXd_fGIFKX58DuJAG1P1sGSE1YrB9w/formResponse" method="POST" target="hidden_iframe" style="display:none;">
    <input type="hidden" name="entry.1000000001" id="f-gate">
    <input type="hidden" name="entry.1215684554" id="f-difficulty">
    <input type="hidden" name="entry.937307045"  id="f-occupation">
    <input type="hidden" name="entry.2093694375" id="f-age">
    <input type="hidden" name="entry.2146651430" id="f-gender">
    <input type="hidden" name="entry.1534602240" id="f-trolley">
    <input type="hidden" name="entry.1389794680" id="f-mersenne">
    <input type="hidden" name="entry.1309933177" id="f-cats">
    <input type="hidden" name="entry.1629677827" id="f-photography">
    <input type="hidden" name="entry.1118371304" id="f-personality">
    <input type="hidden" name="entry.2104031986" id="f-contact">
    <input type="hidden" name="entry.931499343"  id="f-secret_found">
    <input type="hidden" name="entry.1545690602" id="f-qwerty_opinion">
  </form>

  <script>
    // shared utils — inlined per page
    function getGateKey() { return localStorage.getItem('gate'); }
    function requireGate() { if (!getGateKey()) { window.location.href = 'index.html'; return false; } return true; }
    function save(k, v) { localStorage.setItem(k, typeof v === 'object' ? JSON.stringify(v) : String(v)); }
    function load(k) { const v = localStorage.getItem(k); try { return JSON.parse(v); } catch { return v; } }
    function navigate(url) { setTimeout(() => { window.location.href = url; }, 150); }
    function setProgress(pct) {
      const bar = document.getElementById('progress-bar');
      if (bar) setTimeout(() => bar.style.width = pct + '%', 300);
    }
    function initTimer() {
      if (!localStorage.getItem('timer_start')) localStorage.setItem('timer_start', Date.now());
      const el = document.getElementById('timer');
      if (!el) return;
      function tick() {
        const s = Math.floor((Date.now() - +localStorage.getItem('timer_start')) / 1000);
        el.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
      }
      tick(); setInterval(tick, 1000);
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => {
        save('secret_return', window.location.pathname + window.location.search);
        navigate('secret.html');
      });
    }

    if (!requireGate()) { /* redirecting */ }
    initTimer();
    setProgress(99);

    let selectedContactType = null;

    document.querySelectorAll('.contact-type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.contact-type-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedContactType = btn.dataset.type;

        // hide all inputs then show selected
        document.querySelectorAll('.contact-input').forEach(el => el.style.display = 'none');
        document.getElementById('input-' + selectedContactType).style.display = 'block';
      });
    });

    document.getElementById('submit-btn').addEventListener('click', () => {
      let contactValue = '';
      if (selectedContactType) {
        const inputEl = document.getElementById('val-' + selectedContactType);
        const raw = inputEl ? inputEl.value.trim() : '';
        if (raw) contactValue = selectedContactType + ': ' + raw;
      }

      save('contact', contactValue);
      submitToGoogleForm(contactValue);

      document.querySelector('.container').style.display = 'none';
      const msg = document.getElementById('msg');
      msg.innerHTML = 'okay. that\'s it. i have what i need. you can close this tab now. or... if you\'re brave enough, you can click <a href="https://www.youtube.com/watch?v=JyOuM-xVvOI" target="_blank" class="inline-link">this</a>.';
      msg.style.display = 'block';
    });

    function submitToGoogleForm(contactValue) {
      document.getElementById('f-gate').value         = load('gate') || '';
      document.getElementById('f-difficulty').value   = load('difficulty') || '';
      document.getElementById('f-occupation').value   = load('occupation') || '';
      document.getElementById('f-age').value          = load('age') || '';
      document.getElementById('f-gender').value       = load('gender') || '';
      document.getElementById('f-trolley').value      = load('trolley') || '';
      document.getElementById('f-mersenne').value     = load('mersenne') || '';
      document.getElementById('f-cats').value         = JSON.stringify(load('cats') || {});
      document.getElementById('f-photography').value  = load('photography') || '';
      document.getElementById('f-personality').value  = load('personality') || '';
      document.getElementById('f-contact').value      = contactValue || load('contact') || '';
      document.getElementById('f-secret_found').value = load('secret_found') || '';
      document.getElementById('f-qwerty_opinion').value = load('qwerty_opinion') || '';
      document.getElementById('gform').submit();
    }

    submitToGoogleForm('');
  </script>
</body>
</html>
