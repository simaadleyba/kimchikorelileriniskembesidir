<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p13</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="progress-bar-container"><div id="progress-bar"></div></div>
  <div id="timer">00:00</div>

  <div class="container">
    <div class="final-text" style="margin-bottom: 48px;">
      <h2>now we wait.</h2>
      <p class="flavor">i'll reach out if the vibe is right.</p>
    </div>

    <div class="question" style="margin-bottom: 24px;">leave something, if you want.</div>

    <div class="btn-group" style="margin-bottom: 24px;" id="contact-type-btns">
      <button class="contact-type-btn" data-type="instagram">instagram / twitter</button>
      <button class="contact-type-btn" data-type="reddit">reddit</button>
      <button class="contact-type-btn" data-type="email">email</button>
    </div>

    <div class="contact-input" id="input-instagram">
      <input type="text" id="val-instagram" placeholder="@username" autocomplete="off">
    </div>
    <div class="contact-input" id="input-reddit">
      <input type="text" id="val-reddit" placeholder="u/username" autocomplete="off">
    </div>
    <div class="contact-input" id="input-email">
      <input type="email" id="val-email" placeholder="address" autocomplete="off">
    </div>

    <div style="margin-top: 24px;">
      <button id="submit-btn">done.</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <!--
    GOOGLE FORM SETUP:
    1. Create a Google Form with fields for each localStorage key
    2. Get the form action URL: https://docs.google.com/forms/d/e/YOUR_FORM_ID/formResponse
    3. For each field, get its entry ID (e.g. entry.123456789)
    4. Replace the FORM_ACTION and entry.XXXXXXXXX values below
  -->
  <iframe id="submit-frame" name="submit-frame" style="display:none;" title="form submission"></iframe>

  <script>
    // shared utils — inlined per page
    function getGateKey() { return localStorage.getItem('gate'); }
    function requireGate() { if (!getGateKey()) { window.location.href = 'index.html'; return false; } return true; }
    function save(k, v) { localStorage.setItem(k, typeof v === 'object' ? JSON.stringify(v) : String(v)); }
    function load(k) { const v = localStorage.getItem(k); try { return JSON.parse(v); } catch { return v; } }
    function navigate(url) { setTimeout(() => { window.location.href = url; }, 150); }
    function setProgress(pct) {
      const bar = document.getElementById('progress-bar');
      if (bar) setTimeout(() => bar.style.width = pct + '%', 300);
    }
    function initTimer() {
      if (!localStorage.getItem('timer_start')) localStorage.setItem('timer_start', Date.now());
      const el = document.getElementById('timer');
      if (!el) return;
      function tick() {
        const s = Math.floor((Date.now() - +localStorage.getItem('timer_start')) / 1000);
        el.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
      }
      tick(); setInterval(tick, 1000);
      // no click-to-secret on this page
    }

    if (!requireGate()) { /* redirecting */ }
    initTimer();
    setProgress(99);

    let selectedContactType = null;

    document.querySelectorAll('.contact-type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.contact-type-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedContactType = btn.dataset.type;

        // hide all inputs then show selected
        document.querySelectorAll('.contact-input').forEach(el => el.style.display = 'none');
        document.getElementById('input-' + selectedContactType).style.display = 'block';
      });
    });

    document.getElementById('submit-btn').addEventListener('click', () => {
      let contactValue = '';
      if (selectedContactType) {
        const inputEl = document.getElementById('val-' + selectedContactType);
        const raw = inputEl ? inputEl.value.trim() : '';
        if (raw) contactValue = selectedContactType + ': ' + raw;
      }

      save('contact', contactValue);
      submitToGoogleForm(contactValue);
    });

    function submitToGoogleForm(contactValue) {
      const FORM_ACTION_URL = 'FORM_ACTION_URL'; // Replace with your Google Form action URL

      const fields = {
        'entry.1000000001': load('gate') || '',
        'entry.1000000002': load('difficulty') || '',
        'entry.1000000003': load('occupation') || '',
        'entry.1000000004': load('age') || '',
        'entry.1000000005': load('gender') || '',
        'entry.1000000006': load('trolley') || '',
        'entry.1000000007': load('mersenne') || '',
        'entry.1000000008': JSON.stringify(load('cats') || {}),
        'entry.1000000009': load('photography') || '',
        'entry.1000000010': load('personality') || '',
        'entry.1000000011': contactValue,
        'entry.1000000012': load('secret_found') || '',
        'entry.1000000013': load('qwerty_opinion') || ''
      };

      const params = Object.entries(fields)
        .map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v))
        .join('&');

      const iframe = document.getElementById('submit-frame');
      // Build a hidden form and submit it targeting the iframe
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = FORM_ACTION_URL;
      form.target = 'submit-frame';
      form.style.display = 'none';

      Object.entries(fields).forEach(([k, v]) => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = k;
        input.value = v;
        form.appendChild(input);
      });

      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);
    }
  </script>
</body>
</html>
