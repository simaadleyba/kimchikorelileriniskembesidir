<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="progress-bar-container"><div id="progress-bar"></div></div>
  <div id="timer">00:00</div>

  <div class="container">
    <p class="flavor" style="margin-bottom: 40px;">
      this is a questionnaire. it will take somewhere between 4 and 47 minutes
      depending on how long you stare at things.
    </p>

    <h1 style="margin-bottom: 24px;">select difficulty.</h1>

    <div class="btn-group">
      <button id="btn-easy">easy</button>
      <button id="btn-medium">medium</button>
      <button id="btn-hard">hard</button>
    </div>

    <div class="msg" id="diff-msg"></div>
  </div>

  <div class="cookie-banner" id="cookie-banner">
    <span>this site uses cookies. technically.</span>
    <button onclick="dismissCookie()">okay fine</button>
    <button onclick="dismissCookie()">okay FINE</button>
  </div>

  <script>
    // shared utils — inlined per page
    function getGateKey() { return localStorage.getItem('gate'); }
    function requireGate() { if (!getGateKey()) { window.location.href = 'index.html'; return false; } return true; }
    function save(k, v) { localStorage.setItem(k, typeof v === 'object' ? JSON.stringify(v) : String(v)); }
    function load(k) { const v = localStorage.getItem(k); try { return JSON.parse(v); } catch { return v; } }
    function navigate(url) { setTimeout(() => { window.location.href = url; }, 150); }
    function setProgress(pct) {
      const bar = document.getElementById('progress-bar');
      if (bar) setTimeout(() => bar.style.width = pct + '%', 300);
    }
    function initTimer() {
      if (!localStorage.getItem('timer_start')) localStorage.setItem('timer_start', Date.now());
      const el = document.getElementById('timer');
      if (!el) return;
      function tick() {
        const s = Math.floor((Date.now() - +localStorage.getItem('timer_start')) / 1000);
        el.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
      }
      tick(); setInterval(tick, 1000);
      el.addEventListener('click', () => {
        save('secret_return', window.location.pathname + window.location.search);
        navigate('secret.html');
      });
    }

    // gate check
    (function() {
      const params = new URLSearchParams(window.location.search);
      const paramKey = params.get('key');
      const storedKey = localStorage.getItem('gate');

      if (!storedKey) { window.location.href = 'index.html'; return; }
      if (paramKey && paramKey !== storedKey) { window.location.href = 'index.html'; return; }
      if (!paramKey && !storedKey) { window.location.href = 'index.html'; return; }
    })();

    initTimer();
    setProgress(0);

    function dismissCookie() {
      document.getElementById('cookie-banner').style.display = 'none';
    }

    const msgs = {
      easy: "you're a coward. setting it to medium.",
      medium: "you are boring. do you always pick the middle one? you'll solve the hard one instead.",
      hard: "overconfident. let's see if you can handle easy first."
    };

    function pickDifficulty(choice) {
      const msgEl = document.getElementById('diff-msg');
      msgEl.textContent = msgs[choice];
      document.getElementById('btn-easy').disabled = true;
      document.getElementById('btn-medium').disabled = true;
      document.getElementById('btn-hard').disabled = true;
      setTimeout(() => {
        save('difficulty', 'medium');
        navigate('p1.html');
      }, 1800);
    }

    document.getElementById('btn-easy').addEventListener('click', () => pickDifficulty('easy'));
    document.getElementById('btn-medium').addEventListener('click', () => pickDifficulty('medium'));
    document.getElementById('btn-hard').addEventListener('click', () => pickDifficulty('hard'));
  </script>
</body>
</html>
