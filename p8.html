<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p8</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="progress-bar-container"><div id="progress-bar"></div></div>
  <div id="timer">00:00</div>

  <div class="container">
    <p class="flavor" style="margin-bottom: 24px;">one more thing.</p>

    <div class="question">how many mersenne primes are there?</div>

    <input type="text" id="answer" placeholder="your answer" autocomplete="off" style="margin-bottom: 24px;">

    <button id="submit-btn">submit</button>
    <div class="reaction" id="reaction"></div>
  </div>

  <script>
    // shared utils — inlined per page
    function getGateKey() { return localStorage.getItem('gate'); }
    function requireGate() { if (!getGateKey()) { window.location.href = 'index.html'; return false; } return true; }
    function save(k, v) { localStorage.setItem(k, typeof v === 'object' ? JSON.stringify(v) : String(v)); }
    function load(k) { const v = localStorage.getItem(k); try { return JSON.parse(v); } catch { return v; } }
    function navigate(url) { setTimeout(() => { window.location.href = url; }, 150); }
    function setProgress(pct) {
      const bar = document.getElementById('progress-bar');
      if (bar) setTimeout(() => bar.style.width = pct + '%', 300);
    }
    function initTimer() {
      if (!localStorage.getItem('timer_start')) localStorage.setItem('timer_start', Date.now());
      const el = document.getElementById('timer');
      if (!el) return;
      function tick() {
        const s = Math.floor((Date.now() - +localStorage.getItem('timer_start')) / 1000);
        el.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
      }
      tick(); setInterval(tick, 1000);
      el.addEventListener('click', () => {
        save('secret_return', window.location.pathname + window.location.search);
        navigate('secret.html');
      });
    }

    if (!requireGate()) { /* redirecting */ }
    initTimer();
    setProgress(63);

    document.getElementById('submit-btn').addEventListener('click', () => {
      const val = document.getElementById('answer').value.trim();
      if (!val) return;

      save('mersenne', val);
      document.getElementById('submit-btn').disabled = true;

      const reactionEl = document.getElementById('reaction');

      if (val.includes('52')) {
        reactionEl.textContent = 'yes. as of the last discovery. you knew that.';
      } else if (/infinite|infinitely|unknown|we don't know|nobody|open/i.test(val)) {
        reactionEl.textContent = "technically correct. it's an open question. good answer.";
      } else if (/mersenne|prime|2\^|formula|conjecture/i.test(val)) {
        reactionEl.textContent = 'okay. you went technical. noted.';
      } else {
        reactionEl.textContent = 'interesting. moving on.';
      }

      setTimeout(() => navigate('p9.html'), 2000);
    });

    document.getElementById('answer').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('submit-btn').click();
    });
  </script>
</body>
</html>
