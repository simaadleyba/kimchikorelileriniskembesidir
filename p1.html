<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="progress-bar-container"><div id="progress-bar"></div></div>
  <div id="timer">00:00</div>

  <div class="container">
    <p class="flavor" style="margin-bottom: 32px;">this is a preliminary assessment. please answer with care.</p>

    <div class="question">what is 2 + 2?</div>

    <input type="text" id="answer" placeholder="your answer" autocomplete="off" style="margin-bottom: 16px;">

    <div>
      <button id="hint-btn" style="margin-bottom: 8px; font-size: 0.75rem; padding: 6px 14px;">hint</button>
      <div class="hint-text" id="hint-text">it's a number.</div>
    </div>

    <div style="margin-top: 24px;">
      <button id="submit-btn">submit</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <!-- confirmation modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>are you sure?</h2>
      <div class="btn-group">
        <button id="modal-yes">yes</button>
        <button id="modal-no">actually no</button>
      </div>
    </div>
  </div>

  <script>
    // shared utils — inlined per page
    function getGateKey() { return localStorage.getItem('gate'); }
    function requireGate() { if (!getGateKey()) { window.location.href = 'index.html'; return false; } return true; }
    function save(k, v) { localStorage.setItem(k, typeof v === 'object' ? JSON.stringify(v) : String(v)); }
    function load(k) { const v = localStorage.getItem(k); try { return JSON.parse(v); } catch { return v; } }
    function navigate(url) { setTimeout(() => { window.location.href = url; }, 150); }
    function setProgress(pct) {
      const bar = document.getElementById('progress-bar');
      if (bar) setTimeout(() => bar.style.width = pct + '%', 300);
    }
    function initTimer() {
      if (!localStorage.getItem('timer_start')) localStorage.setItem('timer_start', Date.now());
      const el = document.getElementById('timer');
      if (!el) return;
      function tick() {
        const s = Math.floor((Date.now() - +localStorage.getItem('timer_start')) / 1000);
        el.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
      }
      tick(); setInterval(tick, 1000);
      el.addEventListener('click', () => {
        save('secret_return', window.location.pathname + window.location.search);
        navigate('secret.html');
      });
    }

    if (!requireGate()) { /* redirecting */ }
    initTimer();
    setProgress(3);

    let attempts = 7;
    let pendingAnswer = '';

    document.getElementById('hint-btn').addEventListener('click', () => {
      document.getElementById('hint-text').style.display = 'block';
    });

    document.getElementById('submit-btn').addEventListener('click', () => {
      const val = document.getElementById('answer').value.trim();
      if (!val) return;
      pendingAnswer = val;
      document.getElementById('modal').classList.add('open');
    });

    document.getElementById('answer').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('submit-btn').click();
    });

    document.getElementById('modal-no').addEventListener('click', () => {
      document.getElementById('modal').classList.remove('open');
    });

    document.getElementById('modal-yes').addEventListener('click', () => {
      document.getElementById('modal').classList.remove('open');
      checkAnswer(pendingAnswer);
    });

    function checkAnswer(val) {
      const normalized = val.toLowerCase().trim();
      if (normalized === '4' || normalized === 'four') {
        save('p1', val);
        navigate('p2.html');
      } else {
        attempts = Math.max(1, attempts - 1);
        const msgEl = document.getElementById('msg');
        msgEl.className = 'msg error';
        msgEl.textContent = 'incorrect. ' + attempts + ' attempt(s) remaining.';
      }
    }
  </script>
</body>
</html>
