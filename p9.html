<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p9</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="progress-bar-container"><div id="progress-bar"></div></div>
  <div id="timer">00:00</div>

  <div class="container">
    <p class="flavor" style="margin-bottom: 24px;">let's talk about trade-offs.</p>

    <div class="question" style="white-space: pre-line;">the government is taxing one of the following.
you choose which.

  a) your time
  b) your attention
  c) your money

there is no correct answer.
there are only wrong ones.</div>

    <div class="btn-group" id="choice-btns">
      <button id="btn-time">time</button>
      <button id="btn-attention">attention</button>
      <button id="btn-money">money</button>
    </div>

    <div class="reaction" id="reaction"></div>
  </div>

  <script>
    // shared utils — inlined per page
    function getGateKey() { return localStorage.getItem('gate'); }
    function requireGate() { if (!getGateKey()) { window.location.href = 'index.html'; return false; } return true; }
    function save(k, v) { localStorage.setItem(k, typeof v === 'object' ? JSON.stringify(v) : String(v)); }
    function load(k) { const v = localStorage.getItem(k); try { return JSON.parse(v); } catch { return v; } }
    function navigate(url) { setTimeout(() => { window.location.href = url; }, 150); }
    function setProgress(pct) {
      const bar = document.getElementById('progress-bar');
      if (bar) setTimeout(() => bar.style.width = pct + '%', 300);
    }
    function initTimer() {
      if (!localStorage.getItem('timer_start')) localStorage.setItem('timer_start', Date.now());
      const el = document.getElementById('timer');
      if (!el) return;
      function tick() {
        const s = Math.floor((Date.now() - +localStorage.getItem('timer_start')) / 1000);
        el.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
      }
      tick(); setInterval(tick, 1000);
      el.addEventListener('click', () => {
        save('secret_return', window.location.pathname + window.location.search);
        navigate('secret.html');
      });
    }

    if (!requireGate()) { /* redirecting */ }
    initTimer();
    setProgress(74);

    const reactions = {
      time: "everyone says time. it's the one you can't earn back.",
      attention: 'underrated answer.',
      money: 'okay. pragmatic.'
    };

    function handleChoice(choice, label) {
      document.querySelectorAll('#choice-btns button').forEach(b => b.disabled = true);
      save('economics', label);
      document.getElementById('reaction').textContent = reactions[choice];
      setTimeout(() => navigate('p10.html'), 1500);
    }

    document.getElementById('btn-time').addEventListener('click', () => handleChoice('time', 'time'));
    document.getElementById('btn-attention').addEventListener('click', () => handleChoice('attention', 'attention'));
    document.getElementById('btn-money').addEventListener('click', () => handleChoice('money', 'money'));
  </script>
</body>
</html>
