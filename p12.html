<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p12</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="progress-bar-container"><div id="progress-bar"></div></div>
  <div id="timer">00:00</div>

  <div class="container">
    <blockquote class="exchange">
      for hot drinks, i prefer tea. for cold, coffee. i also drink milk, strawberry flavored kefir, coke zero, and orange juice with a concerning amount of enthusiasm.
    </blockquote>

    <div class="question">a hill you'll die on.</div>
    <p class="flavor" style="margin-bottom: 24px;">it doesn't have to be important. just true.</p>

    <textarea id="personality" rows="3" placeholder=""></textarea>

    <div style="margin-top: 24px;">
      <button id="submit-btn">submit</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    // shared utils — inlined per page
    function getGateKey() { return localStorage.getItem('gate'); }
    function requireGate() { if (!getGateKey()) { window.location.href = 'index.html'; return false; } return true; }
    function save(k, v) { localStorage.setItem(k, typeof v === 'object' ? JSON.stringify(v) : String(v)); }
    function load(k) { const v = localStorage.getItem(k); try { return JSON.parse(v); } catch { return v; } }
    function navigate(url) { setTimeout(() => { window.location.href = url; }, 150); }
    function setProgress(pct) {
      const bar = document.getElementById('progress-bar');
      if (bar) setTimeout(() => bar.style.width = pct + '%', 300);
    }
    function initTimer() {
      if (!localStorage.getItem('timer_start')) localStorage.setItem('timer_start', Date.now());
      const el = document.getElementById('timer');
      if (!el) return;
      function tick() {
        const s = Math.floor((Date.now() - +localStorage.getItem('timer_start')) / 1000);
        el.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
      }
      tick(); setInterval(tick, 1000);
      el.addEventListener('click', () => {
        save('secret_return', window.location.pathname + window.location.search);
        navigate('secret.html');
      });
    }

    if (!requireGate()) { /* redirecting */ }
    initTimer();
    setProgress(92);

    document.getElementById('submit-btn').addEventListener('click', () => {
      const val = document.getElementById('personality').value.trim();
      if (!val) {
        const msg = document.getElementById('msg');
        msg.className = 'msg error';
        msg.textContent = 'required.';
        return;
      }
      save('personality', val);
      navigate('p13.html');
    });
  </script>
</body>
</html>
